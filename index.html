<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2b0a1d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Catur Romantis 💕</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // Sebelum module dimuat: cegah zoom double-tap di iOS
    let lastTouch = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouch <= 350) e.preventDefault();
      lastTouch = now;
    }, { passive: false });
  </script>
</head>
<body>
  <div id="hearts-layer" aria-hidden="true"></div>

  <!-- ================= LAYAR SETUP ================= -->
  <div id="screen-setup" class="screen">
    <div class="setup-card">
      <div class="setup-logo">♕</div>
      <h1>Catur Romantis</h1>
      <p class="tagline">untuk kamu &amp; dia 💑</p>

      <label class="lbl" for="in-name">Nama kamu</label>
      <input id="in-name" class="in" type="text" maxlength="16" placeholder="mis. Andal" autocomplete="off" />

      <label class="lbl" for="in-room">Kode kamar</label>
      <input id="in-room" class="in" type="text" maxlength="20" placeholder="mis. sayang" autocomplete="off" />
      <div class="hint">Pacarmu memakai kode yang sama untuk saling terhubung.</div>

      <div class="row-2">
        <button id="btn-join" class="btn btn-primary">Mulai 💕</button>
        <button id="btn-local" class="btn btn-ghost">Mode 1 HP</button>
      </div>

      <div class="online-badge" id="net-badge">
        <span class="dot"></span><span id="net-text">Memeriksa server…</span>
      </div>

      <div id="setup-error" class="setup-error" hidden></div>
    </div>
    <p class="footer-note">dibuat dengan ❤️ · chat &amp; suara langsung antar browser (P2P)</p>
  </div>

  <!-- ================= LAYAR GAME ================= -->
  <div id="screen-game" class="screen" hidden>

    <!-- HEADER -->
    <header class="topbar">
      <div class="tb-left">
        <span class="tb-title">♕ <b id="hd-room">kamar</b></span>
        <span id="hd-status" class="tb-status">Menyambung…</span>
      </div>
      <div class="tb-right">
        <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Menu">☰</button>
      </div>
    </header>

    <div class="top-strip">
      <div class="peer" id="peer-box">
        <span id="peer-avatar" class="avatar">💗</span>
        <span class="peer-name" id="peer-name">Pacarmu</span>
        <span id="peer-state" class="peer-state">offline</span>
      </div>
      <button id="btn-heart" class="heart-btn" title="Kirim hati" aria-label="Kirim hati">💌</button>
      <button id="btn-voice" class="voice-btn off" title="Nyalakan voice" aria-label="Voice">🎙️</button>
    </div>

    <div class="voice-note" id="voice-note" hidden></div>

    <div class="board-wrap">
      <div class="player-label me">
        <span class="avatar me-avatar" id="me-avatar">🖤</span>
        <span id="me-name">Kamu</span>
        <span class="turn-chip" id="turn-chip-me">Giliranmu</span>
      </div>
      <div id="board" class="board" aria-label="Papan catur"></div>
      <div class="status" id="status">Memulai…</div>
      <div class="captured" id="captured-me" title="Bidak yang kamu makan"></div>
      <div class="captured peer-capt" id="captured-peer" title="Bidak yang dia makan"></div>
    </div>

    <div class="actions">
      <button id="btn-undo" class="btn small">↩️ Undo</button>
      <button id="btn-draw" class="btn small">🤝 Tawari Remis</button>
      <button id="btn-resign" class="btn small">🏳️ Menyerah</button>
      <button id="btn-flip" class="btn small">🔄 Balik Papan</button>
      <button id="btn-chat" class="btn small chat-toggle">💬 Chat</button>
    </div>

    <div class="move-box">
      <div class="move-title">Riwayat langkah</div>
      <div id="move-list" class="move-list"></div>
    </div>
  </div>

  <!-- ================= PANEL CHAT ================= -->
  <div id="chat-panel" class="chat-panel" hidden>
    <div class="chat-head">
      <b>Chat</b>
      <button id="chat-close" class="icon-btn" aria-label="Tutup">✕</button>
    </div>
    <div id="chat-msgs" class="chat-msgs"></div>
    <div class="chat-input-row">
      <button id="chat-emoji" class="icon-btn big" aria-label="Emoji">❤️</button>
      <input id="chat-input" class="in chat-in" type="text" maxlength="200" placeholder="Tulis sesuatu manis…" autocomplete="off" />
      <button id="chat-send" class="btn btn-primary small">Kirim</button>
    </div>
    <div id="emoji-row" class="emoji-row" hidden>
      <button data-e="❤️">❤️</button><button data-e="😘">😘</button><button data-e="💕">💕</button>
      <button data-e="😍">😍</button><button data-e="🥰">🥰</button><button data-e="🌹">🌹</button>
      <button data-e="😊">😊</button><button data-e="😭">😭</button><button data-e="😂">😂</button>
      <button data-e="🔥">🔥</button><button data-e="👍">👍</button><button data-e="🤭">🤭</button>
    </div>
  </div>

  <!-- ================= DRAWER MENU ================= -->
  <div id="drawer-mask" class="drawer-mask" hidden></div>
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <b>Menu</b>
      <button id="drawer-close" class="icon-btn" aria-label="Tutup">✕</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-info" id="drawer-info"></div>
      <button id="btn-rematch" class="btn btn-primary">🔁 Main Lagi</button>
      <button id="btn-quit" class="btn btn-ghost danger">🚪 Keluar Kamar</button>
      <button id="btn-mute" class="btn btn-ghost">🔇 Bisukan Suara</button>
    </div>
  </div>

  <!-- ================= DIALOG HASIL / KONFIRMASI ================= -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modal-card">
      <div id="modal-content"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="toast-box" aria-live="polite"></div>

  <script type="module">
    // muat chess.js (ES module) lalu ekspor ke window untuk skrip klasik
    import('/vendor/chess.js').then(m => { window.Chess = m.Chess; });
  </script>
  <script src="/vendor/trystero.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/net.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
